<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akort Aleti</title>
  <meta name="theme-color" content="#0b0d0a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Akort">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="unit" id="unit">
    <header>
      <span class="brand">AKORT</span>
      <span class="status" id="status">MİKROFONU AÇ</span>
    </header>

    <!-- Sol: mikrofon seviyesi. Kırmızı çentik = ölçüm için minimum eşik -->
    <aside class="level">
      <div class="level-bar" id="levelBar">
        <div class="level-fill" id="levelFill"></div>
        <div class="notch"></div>
      </div>
    </aside>

    <!-- 7 segment ekranlar: içleri script.js tarafından çizilir -->
    <section class="readout">
      <div class="note-row">
        <div class="display big" id="noteDisp"></div>
        <span class="sharp" id="sharp">&#9839;</span>
        <div class="display mid" id="octDisp"></div>
      </div>
      <div class="line"><div class="display small" id="freqDisp"></div><span class="tag">HZ</span></div>
    </section>

    <!-- Yatay bar: ortadan sola büyürse pest, sağa büyürse dik. 35-50 sent arası kırmızı -->
    <section class="pitch">
      <div class="pitch-labels"><span>-50</span><span id="centsText">--</span><span>+50</span></div>
      <div class="pitch-bar">
        <div class="fill ok left" id="okL"></div>
        <div class="fill hot left" id="hotL"></div>
        <div class="fill ok right" id="okR"></div>
        <div class="fill hot right" id="hotR"></div>
        <div class="zone"></div>
      </div>
    </section>

    <button id="start" type="button">MİKROFONU BAŞLAT</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
