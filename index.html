<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuner</title>
  <meta name="theme-color" content="#0b0d0a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tuner">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="unit" id="unit">
    <header>
      <span class="brand">TUNER</span>
      <span class="status" id="status">MIC OFF</span>
    </header>

    <!-- Akort düzeni seçici: tıklayınca liste açılır -->
    <button id="modeBtn" class="mode" type="button">
      <span id="modeLabel">CHROMATIC</span><span class="caret"></span>
    </button>

    <!-- Sol: mikrofon seviyesi. Kırmızı çentik = ölçüm için minimum eşik -->
    <aside class="level">
      <div class="level-bar" id="levelBar">
        <div class="level-fill" id="levelFill"></div>
        <div class="notch"></div>
      </div>
    </aside>

    <!-- 7 segment ekranlar: içleri script.js tarafından çizilir -->
    <section class="readout">
      <div class="note-row">
        <div class="display big" id="noteDisp"></div>
        <span class="sharp" id="sharp">&#9839;</span>
        <div class="display mid" id="octDisp"></div>
      </div>
      <div class="strings" id="strings"></div>
      <div class="line"><div class="display small" id="freqDisp"></div><span class="tag">HZ</span></div>
    </section>

    <!-- Yatay bar: ortadan sola büyürse pest, sağa büyürse dik -->
    <section class="pitch">
      <div class="pitch-labels"><span>-50</span><span id="centsText">--</span><span>+50</span></div>
      <div class="pitch-bar">
        <div class="fill left" id="fillL"></div>
        <div class="fill right" id="fillR"></div>
        <div class="zone"></div>
      </div>
    </section>

    <button id="start" type="button">START MIC</button>
  </main>

  <!-- Enstrüman / akort düzeni listesi (içini script.js doldurur) -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-inner">
      <div class="sheet-head">
        <span>SELECT TUNING</span>
        <button id="sheetClose" class="close" type="button">CLOSE</button>
      </div>
      <div id="sheetList"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
